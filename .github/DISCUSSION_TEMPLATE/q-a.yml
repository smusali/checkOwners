title: "[Q&A]: "
body:
  - type: markdown
    attributes:
      value: |
        Ask usage questions here. Bugs, false positives, and features belong on
        the issue tracker, which has forms for each.
  - type: textarea
    id: question
    attributes:
      label: Question
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `checkowners --version`, or the Action tag, if relevant.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: What you already tried
      description: Command, config (no tokens), and what you expected.
    validations:
      required: false
