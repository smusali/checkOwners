
analysis:
  lookback_days: 365
  top_n_owners: 3
  confidence_threshold: 0.2

qualification:
  min_commits: 1

model:
  signals:
    recency:
      weight: 0.30
      half_life_days: 90
    frequency:
      weight: 0.20
    blame:
      weight: 0.20
    reviews:
      weight: 0.15
    change_survival:
      weight: 0.15

decay:
  threshold_days: 180
  alert_on_decay: true
bus_factor:
  critical_threshold: 1
  warn_threshold: 2
paths:
  exclude:
    - "*.lock"
    - "*.whl"
    - "dist/**"
    - "vendor/**"
    - "node_modules/**"
output:
  header: "# Generated by checkOwners. Do not edit manually."
  include_unowned: false
  # Keep confidence scores OUT of the committed CODEOWNERS: publishing a
  # per-file confidence map signals where the codebase is fragile.
  include_confidence: false
drift:
  mode: commit
  min_confidence_delta: 0.2

policy:
  drift:
    fail: true
  # One maintainer owns this repository, so a single expert is expected here.
  single_expert:
    fail: false
    severity: warning
github:
  org: ""
  resolve_handles: true
  resolve_teams: true
  api_enabled: false
  # Do NOT add `token:` here: checkowners.yml is committed to git.
  # Set the GITHUB_TOKEN environment variable instead.

contributors:
  exclude:
    - "@cursoragent"
    - cursoragent@cursor.com
    - noreply@anthropic.com
