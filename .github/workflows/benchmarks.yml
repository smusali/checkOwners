name: Benchmarks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"

      - name: Install locked dependencies
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if python -m pip install --require-hashes -r requirements-dev.lock \
              && python -m pip install -e . --no-deps; then
              exit 0
            fi
            echo "pip install failed (attempt ${attempt}); retrying"
            sleep $((attempt * 8))
          done
          exit 1

      - name: Run pinned public tiers
        run: python benchmarks/harness.py public --output "benchmarks/results/${GITHUB_SHA}.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: benchmarks-${{ github.sha }}
          path: benchmarks/results
