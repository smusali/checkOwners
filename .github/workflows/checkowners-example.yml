name: checkowners-example

on:
  pull_request:

permissions:
  contents: read

jobs:
  drift:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
      issues: write           # required to label PRs as ownership-critical
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0       # git log + git blame need the full history

      # The action always writes the job summary. On same-repo PRs it also
      # posts the drift + bus-factor comment (comment_on_pr defaults to
      # "true"); fork PRs skip the comment. pull-requests: write is granted
      # above for the comment and for the label step below.
      - id: checkowners
        uses: ./  # zizmor: ignore[self-repository]
        with:
          mode: both
          # Keep the action non-failing so the label + fail steps below still
          # run; this workflow gates the merge with its own final step.
          fail_on_drift: "false"
          # Dogfood the checked-out source rather than the pinned wheel so
          # this repo's PRs test the code they contain. Downstream users
          # should OMIT install_spec (the action then installs the pinned wheel).
          install_spec: ".[graph]"

      - name: Assert state directory is cached
        run: test -d "${HOME}/.checkowners"

      - name: Assert owner comparison ran
        run: python3 tools/assert_drift_notes.py

      # Example of consuming the action's outputs for custom logic.
      - name: Add ownership-critical label
        if: fromJson(steps.checkowners.outputs.bus_factor_summary).critical_paths[0]
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash tools/label_pr.sh

      - name: Fail when drift detected
        if: fromJson(steps.checkowners.outputs.drift_summary).drift_detected
        run: |
          echo "checkowners drift detected. Run checkowners sync to resolve."
          exit 1
