name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PIP_DEFAULT_TIMEOUT: "100"
  PIP_RETRIES: "10"

jobs:
  identity-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fail if the previous organization slug reappears
        run: |
          set -euo pipefail
          needle="$(printf '%s%s' 'forty' 'onetech')"
          if git grep -i -- "$needle"; then
            echo "::error::Previous organization slug must not appear in the tree"
            exit 1
          fi

      - name: Fail if GitHub Actions are not SHA-pinned
        run: |
          set -euo pipefail
          python3 tools/check_action_pins.py
          tmp="$(mktemp)"
          printf '%s\n' '- uses: actions/checkout@v4' > "$tmp"
          if python3 tools/check_action_pins.py "$tmp"; then
            echo "expected unpinned reference to fail"
            exit 1
          fi

      - name: Fail if a permissions example grants every scope
        run: |
          set -euo pipefail
          needle="$(printf '%s%s' 'write-' 'all')"
          if git grep -n -F -- "$needle" -- \
            README.md SECURITY.md docs/USAGE.md docs/PRIVACY.md docs/FAQ.md \
            docs/CONTRIBUTING.md examples action.yml .github/workflows
          then
            echo "::error::A permissions example grants every scope"
            exit 1
          fi

  pypi-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install readme-renderer
        run: python -m pip install --require-hashes -r requirements-tools.lock

      - name: Fail if README or project URLs are not PyPI-safe
        run: python tools/check_pypi_readme.py

      - name: Fail if the Action package pin is inconsistent
        run: python tools/check_changelog.py --check-pins

      - name: Fail if a shipped metric has no methodology entry
        run: python tools/check_methodology.py

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0     # required so git log / git blame have history

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install locked dependencies
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if python -m pip install --require-hashes -r requirements-dev.lock \
              && python -m pip install -e . --no-deps; then
              exit 0
            fi
            echo "pip install failed (attempt ${attempt}); retrying"
            sleep $((attempt * 8))
          done
          exit 1

      - name: Run tests
        env:
          HYPOTHESIS_PROFILE: ci
        run: |
          pytest
          coverage report --include=checkowners/patterns.py,checkowners/analyze.py,checkowners/drift.py,checkowners/generate.py --show-missing
          coverage report --include=checkowners/patterns.py --fail-under=100

      - name: Upload coverage
        if: matrix.python-version == '3.14'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  smoke:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install built wheel
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r requirements-tools.lock
          hatch build
          python - <<'PY'
          import re
          import zipfile
          from pathlib import Path

          wheels = list(Path("dist").glob("checkowners-*-py3-none-any.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"expected one wheel, found {wheels}")
          wheel = wheels[0]
          init = (Path("checkowners") / "__init__.py").read_text(encoding="utf-8")
          match = re.search(r'(?m)^__version__ = "([^"]+)"', init)
          if match is None:
              raise SystemExit("__version__ missing from checkowners/__init__.py")
          version = match.group(1)
          with zipfile.ZipFile(wheel) as zf:
              names = zf.namelist()
              if "checkowners/py.typed" not in names:
                  raise SystemExit("wheel is missing checkowners/py.typed")
              meta_name = next(n for n in names if n.endswith(".dist-info/METADATA"))
              meta = zf.read(meta_name).decode("utf-8")
          if f"Version: {version}" not in meta.splitlines():
              raise SystemExit(f"wheel METADATA Version does not match {version!r}")
          PY
          python -m pip install --no-deps dist/checkowners-*-py3-none-any.whl
          python -m pip install --require-hashes -r requirements.lock
          python -c "import github, networkx"

      - name: Smoke-test new commands
        run: |
          checkowners analyze --json > analyze.json
          checkowners drift --json > drift.json
          checkowners qualified-owners --all --json > bus.json
          checkowners decay --json > decay.json
          checkowners topology --json > topology.json
          checkowners balance --json > balance.json
          # Confirm the artifacts have the expected top-level keys.
          python -c "import json; d=json.load(open('drift.json')); assert 'drift_detected' in d and 'severity' in d, d"
          python -c "import json; d=json.load(open('bus.json')); assert 'entries' in d, d"
          python -m pip install --require-hashes -r requirements-dev.lock
          python tools/check_json_contract.py \
            analyze=analyze.json \
            drift=drift.json \
            qualified-owners=bus.json \
            decay=decay.json \
            topology=topology.json \
            balance=balance.json

  token-missing-warning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install hatch and the local package
        run: |
          python -m pip install --require-hashes -r requirements-tools.lock
          hatch build
          python -m pip install --no-deps dist/checkowners-*-py3-none-any.whl
          python -m pip install --require-hashes -r requirements.lock

      - name: Warn when api_enabled and GITHUB_TOKEN is unset
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          src = Path(".github/checkowners.yml").read_text()
          Path("/tmp/checkowners-api.yml").write_text(
              src.replace("api_enabled: false", "api_enabled: true")
          )
          PY
          set +e
          GITHUB_TOKEN= CHECKOWNERS_CONFIG=/tmp/checkowners-api.yml \
            checkowners analyze --json > /tmp/analyze.json 2> /tmp/analyze.err
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "expected exit code 0, got $code"
            cat /tmp/analyze.err
            exit 1
          fi
          if ! grep -q "github.api_enabled is true but GITHUB_TOKEN is not set" /tmp/analyze.err; then
            echo "expected missing-token warning on stderr"
            cat /tmp/analyze.err
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install locked dependencies
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if python -m pip install --require-hashes -r requirements-dev.lock \
              && python -m pip install -e . --no-deps; then
              exit 0
            fi
            echo "pip install failed (attempt ${attempt}); retrying"
            sleep $((attempt * 8))
          done
          exit 1

      - name: Run linters
        run: ruff check . && mypy --strict checkowners/

      - name: Check formatting
        run: ruff format --check .
