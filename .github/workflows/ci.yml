name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PIN_UV: "uv==0.11.32"
  UV_PYTHON_PREFERENCE: only-system

jobs:
  select-test-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - id: set
        shell: bash
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python3 tools/ci_matrix.py

  test:
    needs: select-test-matrix
    name: test (${{ matrix.os }}, ${{ matrix.python-version }}, git ${{ matrix.git-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: ${{ github.event_name == 'pull_request' }}
      matrix: ${{ fromJSON(needs.select-test-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0     # required so git log / git blame have history

      - name: Restore pinned Git
        if: matrix.git-version != 'latest'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ github.workspace }}/.cache/git
          key: git-${{ matrix.git-version }}-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Build pinned Git
        if: matrix.git-version != 'latest'
        env:
          GIT_VERSION: ${{ matrix.git-version }}
        run: bash tools/install_git_version.sh "$GIT_VERSION" "$GITHUB_WORKSPACE/.cache/git"

      - name: Use pinned Git
        if: matrix.git-version != 'latest'
        run: echo "$GITHUB_WORKSPACE/.cache/git/bin" >> "$GITHUB_PATH"

      - name: Show Git version
        run: git --version

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: python -m pip install --quiet "$PIN_UV"

      - name: Install locked dependencies
        run: uv sync --frozen --all-extras --group dev

      - name: Run tests
        run: uv run pytest

  smoke:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"

      - name: Install uv
        run: python -m pip install --quiet "$PIN_UV"

      - name: Install locked dependencies
        run: uv sync --frozen --all-extras --group dev

      - name: Build and exercise the wheel
        run: bash tools/smoke.sh

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"

      - name: Install uv
        run: python -m pip install --quiet "$PIN_UV"

      - name: Install locked dependencies
        run: uv sync --frozen --all-extras --group dev

      - name: Run linters
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Check types
        run: uv run mypy

      - name: Check the Action package pin
        run: uv run python tools/check_changelog.py --check-pins

      - name: Check the repository identity
        run: bash tools/check_repo.sh

  check:
    if: always()
    needs: [select-test-matrix, test, smoke, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          for result in $RESULTS; do test "$result" = success; done
