name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PIP_DEFAULT_TIMEOUT: "100"
  PIP_RETRIES: "10"

jobs:
  identity-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Fail if the previous organization slug reappears
        run: |
          set -euo pipefail
          needle="$(printf '%s%s' 'forty' 'onetech')"
          if git grep -i -- "$needle"; then
            echo "::error::Previous organization slug must not appear in the tree"
            exit 1
          fi

      - name: Fail if GitHub Actions are not SHA-pinned
        run: |
          set -euo pipefail
          python3 tools/check_action_pins.py
          tmp="$(mktemp)"
          printf '%s\n' '- uses: actions/checkout@v4' > "$tmp"
          if python3 tools/check_action_pins.py "$tmp"; then
            echo "expected unpinned reference to fail"
            exit 1
          fi

      - name: Fail if a permissions example grants every scope
        run: |
          set -euo pipefail
          needle="$(printf '%s%s' 'write-' 'all')"
          if git grep -n -F -- "$needle" -- \
            README.md SECURITY.md docs/USAGE.md docs/PRIVACY.md docs/FAQ.md \
            docs/CONTRIBUTING.md examples action.yml .github/workflows
          then
            echo "::error::A permissions example grants every scope"
            exit 1
          fi

  pypi-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"

      - name: Install readme-renderer
        run: python -m pip install --require-hashes -r requirements-tools.lock

      - name: Fail if README or project URLs are not PyPI-safe
        run: python tools/check_pypi_readme.py

      - name: Fail if the Action package pin is inconsistent
        run: python tools/check_changelog.py --check-pins

      - name: Fail if a shipped metric has no methodology entry
        run: python tools/check_methodology.py

  select-test-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        shell: bash
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os

          event = os.environ["GITHUB_EVENT_NAME"]
          pythons = ["3.11", "3.12", "3.13", "3.14"]
          cells = []
          if event == "pull_request":
              for version in pythons:
                  cells.append(
                      {
                          "os": "ubuntu-latest",
                          "python-version": version,
                          "git-version": "latest",
                      }
                  )
              for system in ("macos-latest", "windows-latest"):
                  cells.append(
                      {
                          "os": system,
                          "python-version": "3.14",
                          "git-version": "latest",
                      }
                  )
          else:
              for system in ("ubuntu-latest", "macos-latest", "windows-latest"):
                  for version in pythons:
                      cells.append(
                          {
                              "os": system,
                              "python-version": version,
                              "git-version": "latest",
                          }
                      )
              for git_version in ("2.23.0", "2.39.3"):
                  cells.append(
                      {
                          "os": "ubuntu-latest",
                          "python-version": "3.14",
                          "git-version": git_version,
                      }
                  )
          payload = json.dumps({"include": cells}, separators=(",", ":"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"matrix={payload}\n")
          PY

  test:
    needs: select-test-matrix
    name: test (${{ matrix.os }}, ${{ matrix.python-version }}, git ${{ matrix.git-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: read
      actions: write
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: ${{ github.event_name == 'pull_request' }}
      matrix: ${{ fromJSON(needs.select-test-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0     # required so git log / git blame have history

      - name: Restore pinned Git
        if: matrix.git-version != 'latest'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ github.workspace }}/.cache/git
          key: git-${{ matrix.git-version }}-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Build pinned Git
        if: matrix.git-version != 'latest'
        env:
          GIT_VERSION: ${{ matrix.git-version }}
        run: bash tools/install_git_version.sh "$GIT_VERSION" "$GITHUB_WORKSPACE/.cache/git"

      - name: Use pinned Git
        if: matrix.git-version != 'latest'
        run: echo "$GITHUB_WORKSPACE/.cache/git/bin" >> "$GITHUB_PATH"

      - name: Show Git version
        run: git --version

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install locked dependencies
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if python -m pip install --require-hashes -r requirements-dev.lock \
              && python -m pip install -e . --no-deps; then
              exit 0
            fi
            echo "pip install failed (attempt ${attempt}); retrying"
            sleep $((attempt * 8))
          done
          exit 1

      - name: Run tests
        env:
          HYPOTHESIS_PROFILE: ci
        run: |
          python -m pytest
          include=checkowners/patterns.py,checkowners/analyze.py
          include=$include,checkowners/drift.py,checkowners/generate.py
          python -m coverage report --show-missing --include="$include"
          python -m coverage report --include=checkowners/patterns.py --fail-under=100

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14' && matrix.git-version == 'latest'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  smoke:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"

      - name: Install built wheel
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r requirements-tools.lock
          hatch build
          python tools/check_wheel.py
          python -m pip install --no-deps dist/checkowners-*-py3-none-any.whl
          python -m pip install --require-hashes -r requirements.lock
          python -c "import github, networkx"

      - name: Smoke-test new commands
        run: |
          checkowners analyze --json > analyze.json
          checkowners drift --json > drift.json
          checkowners qualified-owners --all --json > bus.json
          checkowners decay --json > decay.json
          checkowners topology --json > topology.json
          checkowners balance --json > balance.json
          # Confirm the artifacts have the expected top-level keys.
          python - <<'PY'
          import json
          data = json.load(open("drift.json"))
          assert "drift_detected" in data
          assert "severity" in data
          PY
          python -c "import json; d=json.load(open('bus.json')); assert 'entries' in d, d"
          python -m pip install --require-hashes -r requirements-dev.lock
          python tools/check_json_contract.py \
            analyze=analyze.json \
            drift=drift.json \
            qualified-owners=bus.json \
            decay=decay.json \
            topology=topology.json \
            balance=balance.json

  token-missing-warning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"

      - name: Install hatch and the local package
        run: |
          python -m pip install --require-hashes -r requirements-tools.lock
          hatch build
          python -m pip install --no-deps dist/checkowners-*-py3-none-any.whl
          python -m pip install --require-hashes -r requirements.lock

      - name: Warn when api_enabled and GITHUB_TOKEN is unset
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          src = Path(".github/checkowners.yml").read_text()
          Path("/tmp/checkowners-api.yml").write_text(
              src.replace("api_enabled: false", "api_enabled: true")
          )
          PY
          set +e
          GITHUB_TOKEN= CHECKOWNERS_CONFIG=/tmp/checkowners-api.yml \
            checkowners analyze --json > /tmp/analyze.json 2> /tmp/analyze.err
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "expected exit code 0, got $code"
            cat /tmp/analyze.err
            exit 1
          fi
          if ! grep -q "github.api_enabled is true but GITHUB_TOKEN is not set" \
            /tmp/analyze.err; then
            echo "expected missing-token warning on stderr"
            cat /tmp/analyze.err
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"

      - name: Install locked dependencies
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if python -m pip install --require-hashes -r requirements-dev.lock \
              && python -m pip install -e . --no-deps; then
              exit 0
            fi
            echo "pip install failed (attempt ${attempt}); retrying"
            sleep $((attempt * 8))
          done
          exit 1

      - name: Run linters
        run: ruff check . && mypy --strict checkowners/

      - name: Check formatting
        run: ruff format --check .
