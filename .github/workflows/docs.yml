name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"

      - name: Install docs tools
        run: python -m pip install --require-hashes -r requirements-docs.lock

      - name: Install the package
        run: python -m pip install --no-build-isolation --no-deps .

      - name: Build the site
        run: mkdocs build --strict

      - name: Check the built reference and links
        run: python tools/check_docs.py site

      - name: Validate citation metadata
        run: cffconvert --validate

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"

      - name: Install docs tools
        run: python -m pip install --require-hashes -r requirements-docs.lock

      - name: Install the package
        run: python -m pip install --no-build-isolation --no-deps .

      - name: Publish the dev docs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages || true
          mike deploy dev --push
          if ! mike list latest; then
            mike alias dev latest --push
            mike set-default latest --push
          fi

  deploy-release:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"

      - name: Install docs tools
        run: python -m pip install --require-hashes -r requirements-docs.lock

      - name: Install the package
        run: python -m pip install --no-build-isolation --no-deps .

      - name: Publish the release docs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages || true
          version="${GITHUB_REF_NAME#v}"
          mike deploy "$version" --push --update-aliases latest
          mike set-default latest --push
