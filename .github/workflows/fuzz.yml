name: Fuzz

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

env:
  PIP_DEFAULT_TIMEOUT: "100"
  PIP_RETRIES: "10"
  HYPOTHESIS_PROFILE: nightly

jobs:
  fuzz:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install locked dependencies
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if python -m pip install --require-hashes -r requirements-dev.lock \
              && python -m pip install -e . --no-deps; then
              exit 0
            fi
            echo "pip install failed (attempt ${attempt}); retrying"
            sleep $((attempt * 8))
          done
          exit 1

      - name: Extended fuzz
        run: pytest tests/test_patterns.py -k "not git_ls"

      - name: Mutation score
        env:
          HYPOTHESIS_PROFILE: ci
        run: |
          set -euo pipefail
          mutmut run
          python - << 'PY'
          import json
          from pathlib import Path

          meta_path = Path("mutants/checkowners/patterns.py.meta")
          meta = json.loads(meta_path.read_text(encoding="utf-8"))
          codes = meta["exit_code_by_key"]
          killed = sum(code in (1, 3, 37) for code in codes.values())
          survived = sum(code == 0 for code in codes.values())
          scored = killed + survived
          if scored == 0:
              raise SystemExit("patterns.py produced no scored mutants")
          score = 100 * killed / scored
          print(f"mutation score {score:.1f} ({killed} killed, {survived} survived)")
          if score < 90:
              raise SystemExit("mutation score is below 90")
          PY

      - name: Upload fuzz log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-failure
          path: |
            mutants/checkowners/patterns.py.meta
          if-no-files-found: ignore
