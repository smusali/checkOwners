name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 1 * * 1"

permissions:
  contents: read

env:
  PIN_UV: "uv==0.11.32"
  UV_PYTHON_PREFERENCE: only-system

jobs:
  codeql:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
        with:
          languages: python
          build-mode: none

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
        with:
          category: /language:python

  dependency-review:
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0

  pip-audit:
    timeout-minutes: 15
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install --quiet "$PIN_UV"

      - name: Audit the runtime lockfile
        run: uv run --frozen --only-group tools pip-audit --require-hashes --disable-pip -r requirements.lock

      - name: Export the development lockfile
        run: uv export --frozen --no-emit-project --all-groups --all-extras --format requirements-txt -o dev.txt

      - name: Audit the development lockfile
        run: uv run --frozen --only-group tools pip-audit --require-hashes --disable-pip -r dev.txt

  zizmor:
    timeout-minutes: 10
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b  # v0.8.0
        with:
          collect: workflows,actions
          version: "1.30.1"
