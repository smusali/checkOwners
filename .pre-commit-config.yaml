# Install with: pip install pre-commit && pre-commit install
default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.14
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: local
    hooks:
      - id: mypy-strict
        name: mypy --strict
        entry: mypy --strict checkowners/
        language: system
        pass_filenames: false
        files: ^checkowners/.*\.py$
      - id: checkowners-validate
        name: Validate CODEOWNERS syntax
        entry: checkowners validate
        language: system
        pass_filenames: false
        files: '(^|/)CODEOWNERS$'
        stages: [pre-commit, pre-merge-commit, pre-push, manual]
      - id: checkowners-drift
        name: Detect CODEOWNERS drift
        entry: checkowners drift --baseline .checkowners-baseline.json
        language: system
        pass_filenames: false
        stages: [pre-push]
