name: checkOwners
description: >-
  Infer CODEOWNERS from git history with confidence scoring, drift detection,
  bus factor analysis, and expertise decay alerts.
author: Samir Musali
branding:
  icon: shield
  color: blue

inputs:
  config:
    description: Path to the checkowners.yml file.
    required: false
    default: .github/checkowners.yml
  mode:
    description: Drift mode (commit | repo | both).
    required: false
    default: commit
  include_bus_factor:
    description: Emit the bus_factor_summary output.
    required: false
    default: "true"
  include_decay:
    description: Emit the decay_summary output.
    required: false
    default: "true"
  max_output_entries:
    description: >-
      Maximum entries per list in GITHUB_OUTPUT summaries (missing, stale,
      changed, notes, critical_paths, reports). Full payloads are uploaded
      as an artifact. Default 50 keeps each output well under the 1 MB cap.
    required: false
    default: "50"
  fail_on_drift:
    description: Fail the action when drift_detected is true.
    required: false
    default: "true"
  comment_on_pr:
    description: >-
      Post a drift + bus-factor summary comment on same-repo pull requests.
      Requires `pull-requests: write`. Fork pull requests skip the comment
      and write the report to the job summary instead. Set to false to opt
      out.
    required: false
    default: "true"
  python_version:
    description: Python version to set up.
    required: false
    default: "3.13"
  checkowners_version:
    description: >-
      Advanced override for the checkowners package version. Omit or leave
      at the default to install the version that matches this Action tag.
      An empty value uses the pin, never the latest PyPI release.
    required: false
    default: "0.5.0"
  install_spec:
    description: >-
      SECURITY-SENSITIVE. Interpolating untrusted workflow data into this
      input is remote code execution. Allowed only as a local extras spec
      for dogfooding this repository: ".", ".[graph]", ".[github]",
      ".[graph,github]", ".[github,graph]", or ".[all]". Downstream
      callers must omit this input.
    required: false
    default: ""
  index_url:
    description: Optional pip --index-url for an internal package mirror.
    required: false
    default: ""
  offline:
    description: >-
      Install the committed wheel with --no-index --find-links. A fully
      air-gapped runner also needs the lockfile wheels on disk or a mirror.
    required: false
    default: "false"
  github_token:
    description: >-
      Token exported as GITHUB_TOKEN for CLI handle resolution and API
      features, and passed to the PR comment step. Override with a PAT or
      App token when the default job token cannot list org teams or cannot
      comment. A supplied token takes precedence over github.token.
    required: false
    default: ${{ github.token }}

outputs:
  checkowners_drift:
    description: >-
      Bounded JSON drift summary (schema_version 1): drift_detected, severity,
      max_confidence_delta, notes, counts, top entries, and truncated.
      Full drift.json is in the uploaded artifact.
    value: ${{ steps.summary.outputs.checkowners_drift }}
  bus_factor_summary:
    description: >-
      Bounded JSON bus-factor summary (schema_version 1): repo_average,
      counts, critical_paths, and truncated. Per-path entries are omitted
      here and live in the uploaded artifact.
    value: ${{ steps.summary.outputs.bus_factor_summary }}
  decay_summary:
    description: >-
      Bounded JSON decay summary (schema_version 1): counts, top reports,
      and truncated. Full decay.json is in the uploaded artifact.
    value: ${{ steps.summary.outputs.decay_summary }}
  artifact_name:
    description: Name of the uploaded artifact that holds the full JSON payloads.
    value: ${{ steps.summary.outputs.artifact_name }}

runs:
  using: composite
  steps:
    - name: Verify full git history
      shell: bash
      run: |
        # checkowners infers ownership from git log + git blame; a shallow
        # clone (actions/checkout default) would silently produce an empty
        # or wildly wrong ownership map. Fail fast with a fix instead.
        if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
          echo "::error title=checkOwners needs full history::Shallow clone detected. Add 'fetch-depth: 0' to your actions/checkout step so git log and git blame can see the repository history."
          exit 1
        fi

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python_version }}

    - name: Install checkowners
      shell: bash
      env:
        CHECKOWNERS_VERSION: ${{ inputs.checkowners_version }}
        CHECKOWNERS_INSTALL_SPEC: ${{ inputs.install_spec }}
        CHECKOWNERS_INDEX_URL: ${{ inputs.index_url }}
        CHECKOWNERS_OFFLINE: ${{ inputs.offline }}
        CHECKOWNERS_PINNED_VERSION: "0.5.0"
      run: |
        set -euo pipefail
        ACTION_ROOT="${GITHUB_ACTION_PATH}"
        LOCK="${ACTION_ROOT}/requirements.lock"
        VERSION="${CHECKOWNERS_VERSION:-$CHECKOWNERS_PINNED_VERSION}"
        INDEX_ARGS=()
        if [ -n "${CHECKOWNERS_INDEX_URL}" ]; then
          INDEX_ARGS+=(--index-url "${CHECKOWNERS_INDEX_URL}")
        fi

        install_lockfile() {
          python -m pip install --no-deps --require-hashes --only-binary=:all: \
            "$@" -r "${LOCK}"
        }

        if [ -n "${CHECKOWNERS_INSTALL_SPEC}" ]; then
          if [ "${CHECKOWNERS_INSTALL_SPEC}" != "." ] \
            && [ "${CHECKOWNERS_INSTALL_SPEC}" != ".[graph]" ] \
            && [ "${CHECKOWNERS_INSTALL_SPEC}" != ".[github]" ] \
            && [ "${CHECKOWNERS_INSTALL_SPEC}" != ".[graph,github]" ] \
            && [ "${CHECKOWNERS_INSTALL_SPEC}" != ".[github,graph]" ] \
            && [ "${CHECKOWNERS_INSTALL_SPEC}" != ".[all]" ]; then
            echo "::error::install_spec must be a local extras spec: . .[graph] .[github] .[graph,github] .[github,graph] .[all]"
            exit 1
          fi
          install_lockfile "${INDEX_ARGS[@]}"
          python -m pip install --no-deps "${CHECKOWNERS_INSTALL_SPEC}"
        elif [ "${CHECKOWNERS_OFFLINE}" = "true" ]; then
          if [ -n "${CHECKOWNERS_VERSION}" ] && [ "${CHECKOWNERS_VERSION}" != "${CHECKOWNERS_PINNED_VERSION}" ]; then
            echo "::error::offline install requires checkowners_version to match the Action pin (${CHECKOWNERS_PINNED_VERSION})"
            exit 1
          fi
          WHEEL="${ACTION_ROOT}/checkowners-${CHECKOWNERS_PINNED_VERSION}-py3-none-any.whl"
          if [ ! -f "${WHEEL}" ]; then
            echo "::error::offline install requires ${WHEEL}"
            exit 1
          fi
          install_lockfile --no-index --find-links "${ACTION_ROOT}"
          python -m pip install --no-deps --no-index --find-links "${ACTION_ROOT}" \
            "checkowners==${CHECKOWNERS_PINNED_VERSION}"
        elif [ -n "${CHECKOWNERS_VERSION}" ] && [ "${CHECKOWNERS_VERSION}" != "${CHECKOWNERS_PINNED_VERSION}" ]; then
          install_lockfile "${INDEX_ARGS[@]}"
          python -m pip install --no-deps --only-binary=:all: \
            "${INDEX_ARGS[@]}" "checkowners==${VERSION}"
        else
          WHEEL="${ACTION_ROOT}/checkowners-${CHECKOWNERS_PINNED_VERSION}-py3-none-any.whl"
          if [ ! -f "${WHEEL}" ]; then
            echo "::error::missing pinned wheel ${WHEEL}"
            exit 1
          fi
          install_lockfile "${INDEX_ARGS[@]}"
          python -m pip install --no-deps --no-index --find-links "${ACTION_ROOT}" \
            "checkowners==${CHECKOWNERS_PINNED_VERSION}"
        fi

        got="$(checkowners --version)"
        if [ -n "${CHECKOWNERS_INSTALL_SPEC}" ]; then
          if [[ ! "${got}" =~ ^checkowners\ [0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::expected 'checkowners <semver>', got: ${got}"
            exit 1
          fi
        elif [ "${got}" != "checkowners ${VERSION}" ]; then
          echo "::error::installed '${got}', expected 'checkowners ${VERSION}'"
          exit 1
        fi

    - name: Run checkowners drift
      id: run
      shell: bash
      env:
        # Action inputs win over the repo's checkowners.yml.
        CHECKOWNERS_CONFIG: ${{ inputs.config }}
        CHECKOWNERS_DRIFT_MODE: ${{ inputs.mode }}
        CHECKOWNERS_STATE_DIR: ${{ runner.temp }}/checkowners-state
        GITHUB_TOKEN: ${{ inputs.github_token }}
      run: |
        env -u GITHUB_OUTPUT checkowners drift --json > drift.json

    - name: Compute bus factor summary
      id: bus_factor
      if: ${{ inputs.include_bus_factor == 'true' }}
      shell: bash
      env:
        CHECKOWNERS_CONFIG: ${{ inputs.config }}
        CHECKOWNERS_STATE_DIR: ${{ runner.temp }}/checkowners-state
        GITHUB_TOKEN: ${{ inputs.github_token }}
      run: |
        env -u GITHUB_OUTPUT checkowners bus-factor --all --json > bus_factor.json

    - name: Compute decay summary
      id: decay
      if: ${{ inputs.include_decay == 'true' }}
      shell: bash
      env:
        CHECKOWNERS_CONFIG: ${{ inputs.config }}
        CHECKOWNERS_STATE_DIR: ${{ runner.temp }}/checkowners-state
        GITHUB_TOKEN: ${{ inputs.github_token }}
      run: |
        env -u GITHUB_OUTPUT checkowners decay --json > decay.json

    - name: Render job summary
      id: summary
      if: ${{ always() }}
      shell: bash
      env:
        MAX_OUTPUT_ENTRIES: ${{ inputs.max_output_entries }}
        CHECKOWNERS_ARTIFACT_NAME: checkowners-reports
      run: python "${GITHUB_ACTION_PATH}/tools/render_job_summary.py"

    - name: Upload checkowners reports
      if: ${{ always() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ steps.summary.outputs.artifact_name }}
        path: |
          drift.json
          bus_factor.json
          decay.json
          checkowners-report.md
        if-no-files-found: warn

    # Marker lookup paginates past 100 comments; the report body is
    # escaped and capped so paths cannot break the comment.
    - name: Comment drift summary on PR
      if: ${{ always() && inputs.comment_on_pr == 'true' && github.event_name == 'pull_request' }}
      continue-on-error: true
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token || github.token }}
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: python "${GITHUB_ACTION_PATH}/tools/comment_on_pr.py"

    - name: Fail on drift
      if: ${{ inputs.fail_on_drift == 'true' }}
      shell: bash
      run: |
        python - <<'PY'
        import json, sys
        with open("drift.json") as f:
            data = json.load(f)
        if data.get("drift_detected"):
            print("drift detected:", data.get("severity"), "max_delta=", data.get("max_confidence_delta"))
            sys.exit(1)
        PY
