name: checkOwners
description: >-
  Infer CODEOWNERS from git history with confidence, drift, qualified
  owners, and decay alerts.
author: Samir Musali
branding:
  icon: shield
  color: blue

inputs:
  config:
    description: Path to the checkowners.yml file.
    required: false
    default: .github/checkowners.yml
  mode:
    description: Drift mode (commit | repo | both).
    required: false
    default: commit
  include_bus_factor:
    description: Emit the bus_factor_summary output.
    required: false
    default: "true"
  include_decay:
    description: Emit the decay_summary output.
    required: false
    default: "true"
  include_balance:
    description: Emit the balance_summary output. Off unless set to true.
    required: false
    default: "false"
  max_output_entries:
    description: >-
      Maximum entries per list in GITHUB_OUTPUT summaries (missing, stale,
      changed, notes, critical_paths, reports). Full payloads are uploaded
      as an artifact. Default 50 keeps each output well under the 1 MB cap.
    required: false
    default: "50"
  fail_on_drift:
    description: Fail the action with exit code 3 when drift is detected.
    required: false
    default: "true"
  baseline:
    description: >-
      Path to an accepted-findings baseline file. When set, the Action
      fails only on findings that are not in the file.
    required: false
    default: ""
  comment_on_pr:
    description: >-
      Post a drift + qualified-owners summary comment on same-repo pull requests.
      Requires `pull-requests: write`. Fork pull requests skip the comment
      and write the report to the job summary instead. Set to false to opt
      out.
    required: false
    default: "true"
  python_version:
    description: Python version to set up.
    required: false
    default: "3.13"
  checkowners_version:
    description: >-
      Advanced override for the checkowners package version. Omit or leave
      at the default to install the version that matches this Action tag.
      An empty value uses the pin, never the latest PyPI release.
    required: false
    default: "0.6.0"
  install_spec:
    description: >-
      SECURITY-SENSITIVE. Interpolating untrusted workflow data into this
      input is remote code execution. Allowed only as a local extras spec
      for dogfooding this repository: ".", ".[graph]", ".[github]",
      ".[graph,github]", ".[github,graph]", or ".[all]". Downstream
      callers must omit this input.
    required: false
    default: ""
  index_url:
    description: Optional pip --index-url for an internal package mirror.
    required: false
    default: ""
  offline:
    description: >-
      Install the committed wheel with --no-index --find-links. A fully
      air-gapped runner also needs the lockfile wheels on disk or a mirror.
    required: false
    default: "false"
  github_token:
    description: >-
      Token exported as GITHUB_TOKEN for CLI handle resolution and API
      features, and passed to the PR comment step. Override with a PAT or
      App token when the default job token cannot list org teams or cannot
      comment. A supplied token takes precedence over github.token.
    required: false
    default: ${{ github.token }}
  cache:
    description: >-
      Cache pip downloads and ~/.checkowners between runs. Set to false to
      skip both. A restored state file is reused only when its commit is
      HEAD and its config hash and model versions match. Any other restored
      file, including one whose commit is not an ancestor of HEAD, is
      re-analyzed. This does not implement incremental analysis or
      --diff-only: a near-miss restore only warms the directory.
    required: false
    default: "true"

outputs:
  drift_summary:
    description: >-
      Bounded JSON drift summary: drift_detected, severity,
      max_confidence_delta, notes, counts, top entries, and truncated.
      Full drift.json is in the uploaded artifact.
    value: ${{ steps.run.outputs.drift_summary }}
  bus_factor_summary:
    description: >-
      Bounded JSON qualified-owner summary: repo_average,
      qualified_owner_count_cap, counts, critical_paths, and truncated.
      Per-path entries are omitted here and live in the uploaded artifact.
    value: ${{ steps.run.outputs.bus_factor_summary }}
  decay_summary:
    description: >-
      Bounded JSON decay summary: counts, top reports,
      and truncated. Full decay.json is in the uploaded artifact.
    value: ${{ steps.run.outputs.decay_summary }}
  balance_summary:
    description: >-
      Bounded JSON balance summary. Empty unless
      include_balance is true. Full balance.json is uploaded separately.
    value: ${{ steps.run.outputs.balance_summary }}
  artifact_name:
    description: Name of the uploaded artifact that holds the full JSON payloads.
    value: ${{ steps.run.outputs.artifact_name }}

runs:
  using: composite
  steps:
    - name: Verify full git history
      shell: bash
      run: |
        # checkowners infers ownership from git log + git blame; a shallow
        # clone (actions/checkout default) would silently produce an empty
        # or wildly wrong ownership map. Fail fast with a fix instead.
        if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
          echo "::error title=checkOwners needs full history::Shallow clone detected. Add 'fetch-depth: 0' to your actions/checkout step so git log and git blame can see the repository history."
          exit 1
        fi

    - name: Stage pip lockfile
      if: inputs.cache == 'true'
      shell: bash
      run: cp "${GITHUB_ACTION_PATH}/requirements.lock" "${GITHUB_WORKSPACE}/.checkowners-requirements.lock"

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python_version }}
        cache: ${{ inputs.cache == 'true' && 'pip' || '' }}
        cache-dependency-path: ${{ inputs.cache == 'true' && '.checkowners-requirements.lock' || '' }}

    - name: Install checkowners
      shell: bash
      env:
        CHECKOWNERS_VERSION: ${{ inputs.checkowners_version }}
        CHECKOWNERS_INSTALL_SPEC: ${{ inputs.install_spec }}
        CHECKOWNERS_INDEX_URL: ${{ inputs.index_url }}
        CHECKOWNERS_OFFLINE: ${{ inputs.offline }}
        CHECKOWNERS_PINNED_VERSION: "0.6.0"
      run: bash "${GITHUB_ACTION_PATH}/tools/install_checkowners.sh"

    - name: Remove staged pip lockfile
      if: always() && inputs.cache == 'true'
      shell: bash
      run: rm -f "${GITHUB_WORKSPACE}/.checkowners-requirements.lock"

    - name: Compute state cache key
      id: cache-key
      if: inputs.cache == 'true'
      shell: bash
      env:
        CHECKOWNERS_CONFIG: ${{ inputs.config }}
        CHECKOWNERS_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: bash "${GITHUB_ACTION_PATH}/tools/state_cache_key.sh"

    - name: Cache checkowners state
      if: inputs.cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.checkowners
        key: ${{ steps.cache-key.outputs.key }}
        restore-keys: ${{ steps.cache-key.outputs.restore-keys }}

    - name: Run checkowners
      id: run
      shell: bash
      env:
        CHECKOWNERS_CONFIG: ${{ inputs.config }}
        CHECKOWNERS_DRIFT_MODE: ${{ inputs.mode }}
        CHECKOWNERS_USE_CACHE: ${{ inputs.cache }}
        CHECKOWNERS_EPHEMERAL_STATE: ${{ runner.temp }}/checkowners-state
        GITHUB_TOKEN: ${{ inputs.github_token }}
        CHECKOWNERS_FAIL_ON_DRIFT: ${{ inputs.fail_on_drift }}
        CHECKOWNERS_BASELINE: ${{ inputs.baseline }}
        CHECKOWNERS_INCLUDE_BUS_FACTOR: ${{ inputs.include_bus_factor }}
        CHECKOWNERS_INCLUDE_DECAY: ${{ inputs.include_decay }}
        CHECKOWNERS_INCLUDE_BALANCE: ${{ inputs.include_balance }}
        MAX_OUTPUT_ENTRIES: ${{ inputs.max_output_entries }}
        CHECKOWNERS_ARTIFACT_NAME: checkowners-reports
      run: |
        if [ "${CHECKOWNERS_USE_CACHE}" = "true" ]; then
          export CHECKOWNERS_STATE_DIR="${HOME}/.checkowners"
        else
          export CHECKOWNERS_STATE_DIR="${CHECKOWNERS_EPHEMERAL_STATE}"
        fi
        checkowners github-action

    - name: Upload checkowners reports
      if: ${{ always() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ steps.run.outputs.artifact_name }}
        path: |
          drift.json
          bus_factor.json
          decay.json
          checkowners-report.md
        if-no-files-found: warn

    - name: Upload checkowners balance report
      if: ${{ always() && inputs.include_balance == 'true' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: checkowners-balance
        path: balance.json
        if-no-files-found: warn

    # Marker lookup paginates past 100 comments; the report body is
    # escaped and capped so paths cannot break the comment.
    - name: Comment drift summary on PR
      if: ${{ always() && inputs.comment_on_pr == 'true' && github.event_name == 'pull_request' }}
      continue-on-error: true
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token || github.token }}
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: python "${GITHUB_ACTION_PATH}/tools/comment_on_pr.py"
