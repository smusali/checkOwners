analysis:
  lookback_days: 365
  min_commits: 3
  top_n_owners: 3
  confidence_threshold: 0.4
  exclude_bots: true
scoring:
  recency_half_life_days: 45
  recency_weight: 0.5
  frequency_weight: 0.2
  blame_weight: 0.15
  review_weight: 0.15
decay:
  threshold_days: 90
  alert_on_decay: true
bus_factor:
  critical_threshold: 1
  warn_threshold: 2
paths:
  exclude:
    - "*.lock"
    - "package-lock.json"
    - "pnpm-lock.yaml"
    - "dist/**"
    - "vendor/**"
    - "node_modules/**"
    - "*.generated.*"
    - "*.min.js"
    - "*.min.css"
    - "*.map"
output:
  header: "# Generated by checkOwners. Do not edit manually."
  include_unowned: false
  include_confidence: false
  consolidate: true
drift:
  mode: both
  min_confidence_delta: 0.2
notifications:
  webhook_url: ""
  severity_threshold: high
github:
  org: example-org
  resolve_handles: true
  resolve_teams: true
  api_enabled: true
