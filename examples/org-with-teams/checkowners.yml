version: 1

analysis:
  lookback_days: 365
  max_owners: 3
  confidence_threshold: 0.4

qualification:
  min_commits: 3

model:
  signals:
    recency:
      weight: 0.5
      half_life_days: 45
    frequency:
      weight: 0.2
    blame:
      weight: 0.15
    reviews:
      weight: 0.15

bots:
  exclude: true

decay:
  threshold_days: 90
  alert_on_decay: true

bus_factor:
  critical_threshold: 1
  warn_threshold: 2

paths:
  exclude:
    - "*.lock"
    - "package-lock.json"
    - "pnpm-lock.yaml"
    - "dist/**"
    - "vendor/**"
    - "node_modules/**"
    - "*.generated.*"
    - "*.min.js"
    - "*.min.css"
    - "*.map"

output:
  header: "# Generated by checkOwners. Do not edit manually."
  include_unowned: false
  include_confidence: false
  consolidate: true

drift:
  mode: both
  min_confidence_delta: 0.2

github:
  org: example-org
  resolve_handles: true
  resolve_teams: true
  api_enabled: true
