version: 1

analysis:
  lookback_days: 365
  max_owners: 3
  confidence_threshold: 0.2

qualification:
  min_commits: 1

model:
  signals:
    recency:
      weight: 0.35
      half_life_days: 90
    frequency:
      weight: 0.25
    blame:
      weight: 0.25
    reviews:
      weight: 0.15

bots:
  exclude: true

decay:
  threshold_days: 180
  alert_on_decay: true

bus_factor:
  critical_threshold: 1
  warn_threshold: 2

paths:
  exclude:
    - "*.lock"
    - "*.whl"
    - "dist/**"
    - "vendor/**"
    - "node_modules/**"

output:
  header: "# Generated by checkOwners. Do not edit manually."
  include_unowned: false
  include_confidence: false

drift:
  mode: commit
  min_confidence_delta: 0.2

github:
  resolve_handles: true
  resolve_teams: false
  api_enabled: false
