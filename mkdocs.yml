site_name: checkOwners
site_url: https://smusali.github.io/checkowners/
repo_url: https://github.com/smusali/checkowners
repo_name: smusali/checkowners
docs_dir: docs

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search
  - mkdocs-typer2:
      pretty: true
      engine: native

extra:
  version:
    provider: mike

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid

nav:
  - Getting Started: index.md
  - Usage: USAGE.md
  - CLI: cli.md
  - Methodology: METHODOLOGY.md
  - Privacy: PRIVACY.md
  - FAQ: FAQ.md
  - Project:
      - Changelog: CHANGELOG.md
      - Contributing: CONTRIBUTING.md
      - Security: https://github.com/smusali/checkowners/blob/main/SECURITY.md
