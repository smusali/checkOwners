[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "checkowners"
dynamic = ["version"]
description = "Keep CODEOWNERS aligned with reality."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "Samir Musali", email = "samir.musali@gmail.com" },
]
keywords = [
    "codeowners",
    "git",
    "ownership",
    "drift-detection",
    "cli",
    "github-actions",
    "ownership-graph",
    "expertise-decay",
    "team-topology",
    "platform-engineering",
    "code-review",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Version Control :: Git",
    "Typing :: Typed",
]
# Core inference is pure git via subprocess, and the GitHub API is reached
# with urllib, so the runtime needs no git or GitHub client library.
dependencies = [
    "typer>=0.9.0,<1",
    "rich>=13.0.0,<16",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
graph = [
    "networkx>=3.0,<4",
]
all = [
    "checkowners[graph]",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "ruff>=0.4.0",
    "mypy>=1.0",
    "types-PyYAML",
    "jsonschema>=4.18",
    "hypothesis>=6.100,<7",
    "pre-commit>=4,<5",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.6,<10",
    "mike>=2.1,<3",
    "mkdocs-typer2>=0.4,<1",
]
tools = [
    "cyclonedx-bom",
    "pip-audit",
]

[project.urls]
Homepage = "https://github.com/smusali/checkowners"
Issues = "https://github.com/smusali/checkowners/issues"
Source = "https://github.com/smusali/checkowners"
Documentation = "https://smusali.github.io/checkowners/"
Changelog = "https://github.com/smusali/checkowners/blob/main/docs/CHANGELOG.md"

[project.scripts]
checkowners = "checkowners.cli:main"

[tool.hatch.version]
path = "src/checkowners/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/checkowners"]
dev-mode-dirs = ["src"]

[tool.hatch.build.targets.sdist]
only-include = [
    "src/checkowners",
    "tests",
    "schemas",
    "examples",
    "docs",
    "README.md",
    "LICENSE",
    "SECURITY.md",
    "CODE_OF_CONDUCT.md",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "tools"]
extend-exclude = ["docs"]

[tool.ruff.lint]
# S (bandit) and PTH (pathlib) are first-class: the core is subprocess git
# with user-supplied paths. RUF, C4, PL, ARG, TID, ERA are the second pass.
select = [
    "E", "F", "I", "N", "W", "UP", "ANN", "B", "A", "SIM",
    "S", "PTH", "RUF", "C4", "PL", "ARG", "TID", "ERA", "PT",
]
# PLR complexity metrics (arg counts, magic values, statement counts) follow
# the CLI and dataclass surfaces; ratcheting them is not a safety win.
ignore = ["PLR0913", "PLR0917", "PLR2004", "PLR0915", "PLR0911", "PLR0912"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "S108", "S404"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
python_version = "3.11"
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
files = ["src/checkowners", "tests", "tools"]
mypy_path = "src:tools"
explicit_package_bases = true

# networkx ships no type stubs; the per-module override is the durable
# alternative to scattering "type: ignore[import-untyped]" at import sites.
[[tool.mypy.overrides]]
module = "networkx.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
xfail_strict = true
filterwarnings = ["error"]
